services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pfsa
      POSTGRES_PASSWORD: pfsa
      POSTGRES_DB: pfsa
    ports:
      - "5432:5432"
    volumes:
      - pfsa-postgres-data:/var/lib/postgresql/data

volumes:
  pfsa-postgres-data:
